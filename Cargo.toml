[package]
# "loch" = LOC + history. The crates.io name is squatted by a dormant 2019 crate,
# so if this is ever published: rename the package to loch-cli and add
# [[bin]] name = "loch" to keep the binary name.
name = "loch"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Per-commit codebase statistics (LOC history) via gix + tokei, without materializing a working tree"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
gix = "=0.85.0"
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokei = "=14.0.0"

